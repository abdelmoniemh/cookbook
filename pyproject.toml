[project]
name = "cookbook"
version = "0.1.0"
description = "Self-hosted meal prep, cooking and shopping list app built from your own cookbook PDFs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
]

[project.scripts]
cookbook-import = "cookbook.importer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cookbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
