[project]
name = "cookbook"
version = "0.1.0"
description = "Self-hosted meal prep, cooking and shopping list app built from your own cookbook PDFs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "pymupdf>=1.24",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
cookbook-import = "cookbook.importer.cli:main"
cookbook-serve = "cookbook.server.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cookbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
